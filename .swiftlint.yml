included:
  - Onda
  - OndaTests
  - OndaUITests

excluded:
  - build
  - DerivedData

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - redundant_nil_coalescing
  - toggle_bool

disabled_rules:
  - identifier_name

line_length:
  warning: 150
  ignores_urls: true

# PlaybackManager is the central transport hub (state + transport + queue + sleep + restore);
# splitting it would force exposing private state module-wide. Small bump over the 400 default.
file_length:
  warning: 450
