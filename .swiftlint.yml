included:
  - Onda
  - OndaTests
  - OndaUITests

excluded:
  - build
  - DerivedData

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - redundant_nil_coalescing
  - toggle_bool

disabled_rules:
  - identifier_name

line_length:
  warning: 150
  ignores_urls: true

# PlaybackManager is the central transport hub (state + transport + queue + sleep + restore,
# plus configured skips / Smart Resume); splitting it would force exposing private state
# module-wide. Its 1:1 test file mirrors that breadth. Bump over the 400 default.
file_length:
  warning: 980

type_body_length:
  warning: 400

# SwiftFormat's closing-paren-on-own-line / if-else-as-expression style added a few lines to
# OndaApp.init's multi-service wiring, pushing it just over the 50-line default.
function_body_length:
  warning: 60
