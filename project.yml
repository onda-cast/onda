name: Onda
options:
  bundleIdPrefix: com.chasegilliam
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: Z3GNZJ5348
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
targets:
  Onda:
    type: application
    platform: iOS
    sources:
      - Onda
      - path: Resources
        buildPhase: resources
    dependencies:
      - sdk: libsqlite3.tbd
    # INFOPLIST_KEY_* cannot express array-valued plist keys (UIBackgroundModes,
    # BGTaskSchedulerPermittedIdentifiers) — they were silently ignored. Real plist entries:
    info:
      path: Onda/Info.plist
      properties:
        UIBackgroundModes: [audio]
        BGTaskSchedulerPermittedIdentifiers: [com.onda.refresh]
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Onda
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Onda transcribes downloaded episodes on your device so you can read and search them."
    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/swiftlint"
          fi
        basedOnDependencyAnalysis: false
  OndaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OndaTests]
    dependencies:
      - target: Onda
  OndaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OndaUITests]
    dependencies:
      - target: Onda
